<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Ashen Vow</title>
<style>
  html,body{ margin:0; padding:0; overflow:hidden; background:#000; }
  #app{ position:relative; width:100vw; height:100vh; }
  canvas{ display:block; width:100%; height:100%; }
  *{ font-family:'Hiragino Mincho ProN','Hiragino Sans',serif; user-select:none; -webkit-user-select:none; }

  #start{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:22px;
    background:radial-gradient(ellipse at center, #1a1712 0%, #000 75%);
    z-index:50; cursor:pointer; text-align:center; padding:20px; box-sizing:border-box;
  }
  #start h1{ color:#c9a765; font-size:clamp(28px,6vw,54px); letter-spacing:0.15em; margin:0; text-shadow:0 0 30px rgba(201,167,101,0.5); }
  #start p{ color:#9a8f7a; font-size:13px; line-height:2; margin:0; }
  #start .key{ display:inline-block; border:1px solid #6b5f45; border-radius:4px; padding:1px 8px; margin:0 2px; color:#e4d5ab; }
  #start .go{ color:#e4d5ab; font-size:14px; letter-spacing:0.3em; margin-top:12px; animation:pulse 1.8s infinite ease-in-out; }
  #start .loading{ color:#8f8367; font-size:12px; letter-spacing:0.2em; }
  @keyframes pulse{ 0%,100%{opacity:0.35;} 50%{opacity:1;} }

  #hud{ position:absolute; inset:0; pointer-events:none; z-index:10; }
  .bar-wrap{ position:absolute; left:22px; display:flex; align-items:center; gap:10px; }
  .bar-label{ color:#cbb98a; font-size:10px; letter-spacing:0.15em; width:34px; text-align:right; text-shadow:0 1px 2px #000; }
  .bar-bg{ width:230px; height:11px; background:rgba(0,0,0,0.55); border:1px solid rgba(200,180,130,0.35); position:relative; }
  .bar-fill{ position:absolute; inset:0; width:100%; transform-origin:left; transition:transform 0.15s linear; }
  #hpFill{ background:linear-gradient(90deg,#7a1d1d,#c23c3c); }
  #stFill{ background:linear-gradient(90deg,#3f7a2e,#7fce54); transition:transform 0.1s linear, opacity 0.2s; }
  #hpWrap{ bottom:40px; } #stWrap{ bottom:22px; }

  #bossWrap{ position:absolute; top:22px; left:50%; transform:translateX(-50%); width:min(56vw,520px); display:none; flex-direction:column; align-items:center; gap:4px; }
  #bossName{ color:#d8c39a; font-size:13px; letter-spacing:0.3em; text-shadow:0 1px 3px #000; }
  #bossBarBg{ width:100%; height:9px; background:rgba(0,0,0,0.55); border:1px solid rgba(200,180,130,0.35); }
  #bossFill{ height:100%; width:100%; background:linear-gradient(90deg,#5a1a1a,#a83030); transform-origin:left; transition:transform 0.2s ease-out; }

  #lockDot{ position:absolute; top:50%; left:50%; width:14px; height:14px; margin:-7px 0 0 -7px; border:2px solid #d8b96a; border-radius:50%; display:none; box-shadow:0 0 8px rgba(216,185,106,0.7); }
  #crosshair{ position:absolute; top:50%; left:50%; width:4px; height:4px; margin:-2px 0 0 -2px; background:rgba(230,220,190,0.6); border-radius:50%; }

  #msg{ position:absolute; top:38%; left:50%; transform:translate(-50%,-50%); text-align:center; z-index:20; opacity:0; pointer-events:none; transition:opacity 1.1s ease; }
  #msg.show{ opacity:1; }
  #msg .big{ font-size:clamp(34px,7vw,64px); letter-spacing:0.35em; color:#9c1c1c; text-shadow:0 0 40px rgba(156,28,28,0.8); }
  #msg .big.win{ color:#d8b96a; text-shadow:0 0 40px rgba(216,185,106,0.8); }
  #msg .small{ margin-top:14px; color:#c9bfa8; font-size:13px; letter-spacing:0.2em; }

  #restart{
    position:absolute; bottom:60px; left:50%; transform:translateX(-50%);
    color:#d8c39a; font-size:12px; letter-spacing:0.2em; border:1px solid #6b5f45;
    padding:8px 22px; background:rgba(0,0,0,0.4); opacity:0; pointer-events:none; transition:opacity 0.6s ease 0.6s;
    cursor:pointer; z-index:21;
  }
  #restart.show{ opacity:1; pointer-events:auto; }

  #hint{ position:absolute; bottom:16px; left:50%; transform:translateX(-50%); color:#8f8367; font-size:10.5px; letter-spacing:0.08em; text-align:center; line-height:1.8; text-shadow:0 1px 2px #000; }
</style>
</head>
<body>
<div id="app">
  <div id="start">
    <h1>ASHEN&nbsp;VOW</h1>
    <p>
      <span class="key">WASD</span>移動 &nbsp; <span class="key">マウス</span>視点 &nbsp; <span class="key">左クリック</span>攻撃<br/>
      <span class="key">Shift</span>/<span class="key">Space</span>ローリング回避 &nbsp; <span class="key">Tab</span>ロックオン<br/>
      🎮 <span class="key">左スティック</span>移動 &nbsp; <span class="key">右スティック</span>視点 &nbsp; <span class="key">R1</span>攻撃 &nbsp; <span class="key">○</span>回避 &nbsp; <span class="key">R3</span>ロックオン
    </p>
    <div class="loading" id="loadingText">読み込み中...</div>
    <div class="go" id="goText" style="display:none;">クリックまたはコントローラーのボタンで開始</div>
  </div>

  <div id="hud">
    <div class="bar-wrap" id="hpWrap"><span class="bar-label">HP</span><div class="bar-bg"><div class="bar-fill" id="hpFill"></div></div></div>
    <div class="bar-wrap" id="stWrap"><span class="bar-label">STA</span><div class="bar-bg"><div class="bar-fill" id="stFill"></div></div></div>
    <div id="bossWrap"><div id="bossName">徘徊の墓守</div><div id="bossBarBg"><div id="bossFill"></div></div></div>
    <div id="crosshair"></div>
    <div id="lockDot"></div>
    <div id="hint">クリック/R1: 攻撃&nbsp;&nbsp;/&nbsp;&nbsp;Shift・Space・○: 回避&nbsp;&nbsp;/&nbsp;&nbsp;Tab・R3: ロックオン切替&nbsp;&nbsp;/&nbsp;&nbsp;Esc: マウス解放</div>
  </div>

  <div id="msg"><div class="big" id="msgBig">YOU DIED</div><div class="small" id="msgSmall">灰は、灰に</div></div>
  <div id="restart">篝火で休む(再挑戦)</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
  'use strict';

  // ---------------------------------------------------------------
  // Setup
  // ---------------------------------------------------------------
  var app = document.getElementById('app');
  var renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  app.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var FOG_COLOR = 0x0d0f14;
  scene.background = new THREE.Color(FOG_COLOR);
  scene.fog = new THREE.FogExp2(FOG_COLOR, 0.026);

  var camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 500);

  var composer, bloomPass;
  function setupComposer(){
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.55, 0.82);
    composer.addPass(bloomPass);
  }

  function resize(){
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    if(composer) composer.setSize(innerWidth, innerHeight);
  }
  addEventListener('resize', resize);
  resize();
  setupComposer();

  // ---------------------------------------------------------------
  // Lighting & Arena
  // ---------------------------------------------------------------
  scene.add(new THREE.AmbientLight(0x5a5a6e, 0.5));
  var moon = new THREE.DirectionalLight(0x9fb0d8, 0.6);
  moon.position.set(-20, 40, -10);
  moon.castShadow = true;
  moon.shadow.mapSize.set(1024,1024);
  moon.shadow.camera.left = -40; moon.shadow.camera.right = 40;
  moon.shadow.camera.top = 40; moon.shadow.camera.bottom = -40;
  scene.add(moon);

  var groundMat = new THREE.MeshStandardMaterial({ color:0x2a2721, roughness:0.95, metalness:0.05 });
  var ground = new THREE.Mesh(new THREE.CircleGeometry(38, 48), groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);

  var ringMat = new THREE.MeshStandardMaterial({ color:0x1f1c17, roughness:0.9 });
  for(var ring=0; ring<3; ring++){
    var r0 = 10 + ring*9;
    var ringMesh = new THREE.Mesh(new THREE.RingGeometry(r0, r0+0.35, 48), ringMat);
    ringMesh.rotation.x = -Math.PI/2; ringMesh.position.y = 0.02;
    scene.add(ringMesh);
  }

  var outerMat = new THREE.MeshStandardMaterial({ color:0x08080a, roughness:1 });
  var outer = new THREE.Mesh(new THREE.CircleGeometry(200,48), outerMat);
  outer.rotation.x = -Math.PI/2; outer.position.y = -0.05;
  scene.add(outer);

  function torch(x,z){
    var g = new THREE.Group();
    var pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.1,2.4,6), new THREE.MeshStandardMaterial({color:0x2b2420, roughness:0.8}));
    pole.position.y = 1.2; pole.castShadow = true;
    g.add(pole);
    var flame = new THREE.Mesh(new THREE.SphereGeometry(0.22,8,8), new THREE.MeshBasicMaterial({ color:0xffb347 }));
    flame.position.y = 2.5;
    g.add(flame);
    var light = new THREE.PointLight(0xff9a3c, 1.8, 13, 2);
    light.position.y = 2.5;
    g.add(light);
    g.position.set(x,0,z);
    g.userData.flame = flame; g.userData.light = light; g.userData.base = 1.8;
    scene.add(g);
    return g;
  }
  var torches = [ torch(14,14), torch(-14,14), torch(14,-14), torch(-14,-14), torch(0,20), torch(0,-20) ];

  var pillarMat = new THREE.MeshStandardMaterial({ color:0x38352e, roughness:0.9 });
  [[20,0],[-20,0],[0,26],[0,-26],[18,18],[-18,-18],[18,-18],[-18,18]].forEach(function(p){
    var h = 3.5 + Math.random()*2.5;
    var c = new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.9,h,8), pillarMat);
    c.position.set(p[0], h/2, p[1]);
    c.castShadow = true; c.receiveShadow = true;
    scene.add(c);
  });

  // ---- ember particles ----
  var EMBER_N = 140;
  var emberGeo = new THREE.BufferGeometry();
  var emberPos = new Float32Array(EMBER_N*3);
  var emberSpeed = new Float32Array(EMBER_N);
  for(var i=0;i<EMBER_N;i++){
    var a = Math.random()*Math.PI*2, r = Math.random()*30;
    emberPos[i*3] = Math.cos(a)*r;
    emberPos[i*3+1] = Math.random()*6;
    emberPos[i*3+2] = Math.sin(a)*r;
    emberSpeed[i] = 0.25 + Math.random()*0.5;
  }
  emberGeo.setAttribute('position', new THREE.BufferAttribute(emberPos,3));
  var emberMat = new THREE.PointsMaterial({ color:0xffa64d, size:0.09, transparent:true, opacity:0.75, depthWrite:false, blending:THREE.AdditiveBlending });
  var embers = new THREE.Points(emberGeo, emberMat);
  scene.add(embers);

  var ARENA_R = 34;

  // ---------------------------------------------------------------
  // Character loading
  // ---------------------------------------------------------------
  var MODEL_SCALE = 0.0032;
  var ASSET_BASE = 'assets/knight/';
  var manager = new THREE.LoadingManager();
  var loader = new THREE.FBXLoader(manager);

  function stripRootMotion(clip){
    clip.tracks = clip.tracks.filter(function(t){
      if(t.name === 'Bone.position'){
        // keep only vertical(Y) component so in-place motion has no world drift
        var vals = t.values;
        for(var k=0;k<vals.length;k+=3){ vals[k]=vals[0]; vals[k+2]=vals[2]; }
      }
      return true;
    });
    return clip;
  }

  function makeFighter(fbx, opts){
    var root = new THREE.Group();
    fbx.scale.setScalar(MODEL_SCALE * (opts.scale||1));
    fbx.traverse(function(c){
      if(c.isMesh){
        c.castShadow = true; c.receiveShadow = true;
        if(opts.tint){
          var mats = Array.isArray(c.material) ? c.material : [c.material];
          mats.forEach(function(m){
            if(m && m.color){ m.color.lerp(new THREE.Color(opts.tint), opts.tintAmt||0.5); }
            if(m){ m.roughness = 0.6; m.metalness = 0.25; }
          });
        }
      }
    });
    root.add(fbx);

    var clips = {};
    fbx.animations.forEach(function(c){
      stripRootMotion(c);
      var key = c.name.split('|')[1] || c.name;
      clips[key] = c;
    });

    var mixer = new THREE.AnimationMixer(fbx);
    var actions = {};
    Object.keys(clips).forEach(function(k){ actions[k] = mixer.clipAction(clips[k]); });

    var palmR = fbx.getObjectByName('PalmR');

    root.userData.fbx = fbx;
    root.userData.mixer = mixer;
    root.userData.actions = actions;
    root.userData.palmR = palmR;
    root.userData.current = null;
    root.userData.scale = opts.scale||1;

    return root;
  }

  function bodyRadius(fighter){ return 0.55 * (fighter.userData.scale||1); }

  function playAction(fighter, name, opts){
    opts = opts || {};
    var actions = fighter.userData.actions;
    var next = actions[name];
    if(!next) return;
    if(fighter.userData.current === next && !opts.restart) return;
    var prev = fighter.userData.current;
    next.reset();
    next.setLoop(opts.loop!==undefined?opts.loop:THREE.LoopRepeat);
    next.clampWhenFinished = !!opts.clamp;
    next.timeScale = opts.timeScale || 1;
    next.enabled = true;
    next.play();
    if(prev && prev !== next) next.crossFadeFrom(prev, opts.fade!==undefined?opts.fade:0.15, false);
    fighter.userData.current = next;
  }

  // PalmR bone carries an unnormalized local scale (~100x) baked in from the
  // source rig, invisible on the skinned body (bind-pose compensated) but very
  // visible on anything rigidly parented to it - so weapons need a matching
  // inverse factor to land back at the character's true world scale.
  var PALM_BONE_SCALE = 100;
  function attachWeapon(fighter, weaponFbx, offset){
    var palmR = fighter.userData.palmR;
    var rawBox = new THREE.Box3().setFromObject(weaponFbx);
    weaponFbx.scale.setScalar((offset.sizeMul||1) / PALM_BONE_SCALE);
    weaponFbx.position.set(offset.pos[0], offset.pos[1], offset.pos[2]);
    weaponFbx.rotation.set(offset.rot[0], offset.rot[1], offset.rot[2]);
    weaponFbx.traverse(function(c){ if(c.isMesh){ c.castShadow = true; } });
    palmR.add(weaponFbx);
    fighter.userData.weapon = weaponFbx;
    fighter.userData.weaponTipLen = rawBox.max.y;
  }

  // Real weapon-vs-body hit test: samples points along the blade (grip, mid,
  // tip) in world space and checks whether any of them enters the target's
  // body sphere - damage only lands when the weapon geometry actually
  // reaches the target, not just "roughly close and facing".
  function weaponHitPoints(fighter){
    var weapon = fighter.userData.weapon;
    var tipLen = fighter.userData.weaponTipLen || 0;
    var grip = weapon.getWorldPosition(new THREE.Vector3());
    var mid = weapon.localToWorld(new THREE.Vector3(0, tipLen*0.5, 0));
    var tip = weapon.localToWorld(new THREE.Vector3(0, tipLen, 0));
    return [grip, mid, tip];
  }
  function weaponTouches(attacker, target){
    var pts = weaponHitPoints(attacker);
    var center = new THREE.Vector3().copy(target.position);
    center.y += 0.9 * (target.userData.scale||1);
    var r = bodyRadius(target) * 1.3;
    for(var i=0;i<pts.length;i++){ if(pts[i].distanceTo(center) < r) return true; }
    return false;
  }

  // ---------------------------------------------------------------
  // Load everything
  // ---------------------------------------------------------------
  var player, boss;
  var assetsReady = false;

  var toLoad = ['KnightCharacter.fbx','KnightCharacter.fbx','Sword.fbx','Club.fbx'];
  var loaded = [];
  function loadAll(cb){
    var count = 0;
    toLoad.forEach(function(name, idx){
      loader.load(ASSET_BASE+name, function(obj){
        loaded[idx] = obj;
        count++;
        if(count === toLoad.length) cb();
      }, undefined, function(err){ console.error('load error', name, err); });
    });
  }

  var loadingText = document.getElementById('loadingText');
  var goText = document.getElementById('goText');

  loadAll(function(){
    player = makeFighter(loaded[0], { scale:1 });
    boss = makeFighter(loaded[1], { scale:1.55, tint:0x4a1010, tintAmt:0.55 });

    attachWeapon(player, loaded[2], { pos:[0,0,0], rot:[Math.PI/2, 0, 0] });
    attachWeapon(boss, loaded[3], { pos:[0,0,0], rot:[Math.PI/2, 0, 0] });

    player.position.set(0,0,8);
    boss.position.set(0,0,-10);
    scene.add(player); scene.add(boss);

    playAction(player, 'Idle');
    playAction(boss, 'Idle');

    assetsReady = true;
    loadingText.style.display = 'none';
    goText.style.display = 'block';

  });

  // ---------------------------------------------------------------
  // Input
  // ---------------------------------------------------------------
  var keys = {};
  var mouseDown = false;
  var yaw = Math.PI, pitch = -0.18;
  var locked = false;
  var gameStarted = false;

  var startEl = document.getElementById('start');
  function startGame(){
    if(!assetsReady || gameStarted) return;
    gameStarted = true;
    startEl.style.display = 'none';
  }
  startEl.addEventListener('click', function(){
    if(!assetsReady) return;
    renderer.domElement.requestPointerLock();
    startGame();
  });
  document.addEventListener('pointerlockchange', function(){
    locked = document.pointerLockElement === renderer.domElement;
  });
  renderer.domElement.addEventListener('click', function(){
    if(gameStarted && !locked) renderer.domElement.requestPointerLock();
  });
  document.addEventListener('mousemove', function(e){
    if(!locked) return;
    yaw -= e.movementX * 0.0026;
    pitch -= e.movementY * 0.0022;
    pitch = Math.max(-0.7, Math.min(0.55, pitch));
  });
  document.addEventListener('mousedown', function(e){ if(locked && e.button===0) mouseDown = true; });
  document.addEventListener('mouseup', function(e){ if(e.button===0) mouseDown = false; });
  document.addEventListener('keydown', function(e){
    keys[e.code] = true;
    if(e.code === 'Tab'){ e.preventDefault(); toggleLockOn(); }
  });
  document.addEventListener('keyup', function(e){ keys[e.code] = false; });

  // ---- gamepad (PS/Xbox) ----
  var gamepadIndex = null;
  var gpAttack = false, gpRoll = false;
  var gpLockOnPrev = false, gpStartPrev = false;
  var GP_DEADZONE = 0.16;
  addEventListener('gamepadconnected', function(e){ gamepadIndex = e.gamepad.index; });
  addEventListener('gamepaddisconnected', function(e){ if(gamepadIndex === e.gamepad.index) gamepadIndex = null; });

  function applyDeadzone(v){ return Math.abs(v) < GP_DEADZONE ? 0 : v; }

  var gpMoveX = 0, gpMoveY = 0;
  function pollGamepad(dt){
    if(gamepadIndex === null) return;
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    var gp = pads[gamepadIndex];
    if(!gp) return;

    var anyPressed = gp.buttons.some(function(b){ return b.pressed; });
    if(!gameStarted){
      if(anyPressed && !gpStartPrev) startGame();
      gpStartPrev = anyPressed;
      return;
    }

    gpMoveX = applyDeadzone(gp.axes[0]||0);
    gpMoveY = applyDeadzone(gp.axes[1]||0);
    var lookX = applyDeadzone(gp.axes[2]||0);
    var lookY = applyDeadzone(gp.axes[3]||0);
    yaw -= lookX * 2.2 * dt;
    pitch -= lookY * 1.8 * dt;
    pitch = Math.max(-0.7, Math.min(0.55, pitch));

    gpAttack = !!(gp.buttons[5] && gp.buttons[5].pressed); // R1
    gpRoll = !!(gp.buttons[1] && gp.buttons[1].pressed); // Circle/B

    var lockBtn = !!(gp.buttons[11] && gp.buttons[11].pressed); // R3
    if(lockBtn && !gpLockOnPrev) toggleLockOn();
    gpLockOnPrev = lockBtn;
  }

  // ---------------------------------------------------------------
  // Player / Boss state
  // ---------------------------------------------------------------
  var ATK_DUR = 0.83, ROLL_DUR = 0.42, DEATH_DUR = 1.4;

  var P = {
    hp:100, maxHp:100, st:100, maxSt:100, staminaRegenDelay:0,
    speed:5.0, facing:new THREE.Vector3(0,0,-1),
    rolling:false, rollT:0, rollDur:ROLL_DUR, rollDir:new THREE.Vector3(), invuln:false,
    attacking:false, atkT:0, atkDur:ATK_DUR, atkHit:false,
    hurt:false, hurtT:0, dead:false, lockOn:false,
  };
  var B = { hp:300, maxHp:300, state:'idle', stateT:0, speed:3.1, dead:false, hitThisAttack:false, attackDur:ATK_DUR };

  var hpFill = document.getElementById('hpFill');
  var stFill = document.getElementById('stFill');
  var bossWrap = document.getElementById('bossWrap');
  var bossFill = document.getElementById('bossFill');
  var lockDot = document.getElementById('lockDot');
  var msg = document.getElementById('msg');
  var msgBig = document.getElementById('msgBig');
  var msgSmall = document.getElementById('msgSmall');
  var restartBtn = document.getElementById('restart');
  bossWrap.style.display = 'flex';

  function toggleLockOn(){
    if(B.dead || !assetsReady) return;
    P.lockOn = !P.lockOn;
    lockDot.style.display = P.lockOn ? 'block' : 'none';
  }
  restartBtn.addEventListener('click', function(){ resetGame(); });

  function resetGame(){
    P.hp=P.maxHp; P.st=P.maxSt; P.dead=false; P.rolling=false; P.attacking=false; P.hurt=false;
    player.position.set(0,0,8); player.rotation.y = 0;
    B.hp=B.maxHp; B.dead=false; B.state='idle'; B.stateT=0;
    boss.position.set(0,0,-10); boss.visible = true;
    playAction(player,'Idle',{restart:true}); playAction(boss,'Idle',{restart:true});
    msg.classList.remove('show'); restartBtn.classList.remove('show');
    bossWrap.style.display = 'flex';
    yaw = Math.PI; pitch = -0.18;
  }

  function clampToArena(pos){
    var d = Math.sqrt(pos.x*pos.x + pos.z*pos.z);
    if(d > ARENA_R){ var s = ARENA_R/d; pos.x *= s; pos.z *= s; }
  }

  function showMessage(big, small, isWin){
    msgBig.textContent = big; msgBig.classList.toggle('win', !!isWin);
    msgSmall.textContent = small; msg.classList.add('show');
    setTimeout(function(){ restartBtn.classList.add('show'); }, 900);
  }

  function flashHit(fighter){
    fighter.traverse(function(c){
      if(c.isMesh && c.material){
        var mats = Array.isArray(c.material)?c.material:[c.material];
        mats.forEach(function(m){
          if(!m || !m.emissive) return;
          var orig = m.emissive.getHex();
          m.emissive.setHex(0xaa2222);
          setTimeout(function(){ m.emissive.setHex(orig); }, 90);
        });
      }
    });
  }

  function damageBoss(amount){
    if(B.dead) return;
    B.hp = Math.max(0, B.hp-amount);
    bossFill.style.transform = 'scaleX(' + (B.hp/B.maxHp) + ')';
    flashHit(boss);
    if(B.hp<=0){
      B.dead = true; B.state='dead';
      playAction(boss,'Death',{loop:THREE.LoopOnce, clamp:true, fade:0.2});
      setTimeout(function(){ showMessage('VICTORY','灰は継がれた', true); }, 500);
    }
  }
  function damagePlayer(amount){
    if(P.invuln || P.dead) return;
    P.hp = Math.max(0, P.hp-amount);
    P.hurt = true; P.hurtT = 0.3;
    flashHit(player);
    if(P.hp<=0){
      P.dead = true;
      playAction(player,'Death',{loop:THREE.LoopOnce, clamp:true, fade:0.2});
      setTimeout(function(){ showMessage('YOU DIED','灰は、灰に'); }, 600);
    }
  }

  // ---------------------------------------------------------------
  // Update loops
  // ---------------------------------------------------------------
  function updatePlayer(dt){
    if(!assetsReady || P.dead) return;

    if(P.staminaRegenDelay>0) P.staminaRegenDelay -= dt;
    else if(P.st<P.maxSt) P.st = Math.min(P.maxSt, P.st+dt*28);

    var fwd = new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)).multiplyScalar(-1);
    var right = new THREE.Vector3(fwd.z,0,-fwd.x);
    var move = new THREE.Vector3();
    if(!P.rolling && !P.attacking){
      if(keys['KeyW']) move.add(fwd);
      if(keys['KeyS']) move.sub(fwd);
      if(keys['KeyD']) move.add(right);
      if(keys['KeyA']) move.sub(right);
      move.addScaledVector(fwd, -gpMoveY);
      move.addScaledVector(right, -gpMoveX);
    }
    var moving = move.lengthSq()>0.0001;
    if(moving) move.normalize();

    if(P.lockOn && !B.dead){
      var toBoss = new THREE.Vector3().subVectors(boss.position, player.position); toBoss.y=0; toBoss.normalize();
      var ang = Math.atan2(toBoss.x, toBoss.z);
      player.rotation.y = ang;
      P.facing.set(Math.sin(ang),0,Math.cos(ang));
    } else if(moving){
      var ang2 = Math.atan2(move.x, move.z);
      player.rotation.y = ang2;
      P.facing.copy(move);
    }

    if((keys['ShiftLeft']||keys['Space']||gpRoll) && !P.rolling && !P.attacking && P.st>=22){
      keys['Space']=false; gpRoll=false;
      P.rolling=true; P.rollT=0; P.st-=22; P.staminaRegenDelay=0.5;
      P.rollDir.copy(moving?move:P.facing);
      P.invuln = true;
      playAction(player,'Roll_sword',{loop:THREE.LoopOnce, clamp:true, fade:0.05, timeScale:1.25/P.rollDur});
    }
    if(P.rolling){
      P.rollT += dt;
      var pr = Math.min(1, P.rollT/P.rollDur);
      var dist = 3.6*dt/P.rollDur * (1-Math.pow(pr-0.5,2)*1.6);
      player.position.addScaledVector(P.rollDir, Math.max(0,dist));
      clampToArena(player.position);
      if(pr>0.65) P.invuln=false;
      if(pr>=1){ P.rolling=false; P.invuln=false; }
    } else if(moving){
      player.position.addScaledVector(move, P.speed*dt);
      clampToArena(player.position);
    }

    if((mouseDown||gpAttack) && !P.attacking && !P.rolling && P.st>=18){
      P.attacking=true; P.atkT=0; P.atkHit=false; P.st-=18; P.staminaRegenDelay=0.6;
      playAction(player,'Run_swordAttack',{loop:THREE.LoopOnce, clamp:true, fade:0.08});
    }
    if(P.attacking){
      P.atkT += dt;
      var p2 = P.atkT/P.atkDur;
      if(p2>0.32 && p2<0.62 && !P.atkHit && !B.dead){
        if(weaponTouches(player, boss)){ P.atkHit=true; damageBoss(24); }
      }
      if(P.atkT>=P.atkDur){ P.attacking=false; playAction(player, moving?'Run':'Idle'); }
    }

    if(!P.attacking && !P.rolling && !P.dead){
      playAction(player, moving?'Run':'Idle');
    }

    if(P.hurt){ P.hurtT -= dt; if(P.hurtT<=0) P.hurt=false; }

    hpFill.style.transform = 'scaleX('+(P.hp/P.maxHp)+')';
    stFill.style.transform = 'scaleX('+(Math.max(0,P.st)/P.maxSt)+')';
    stFill.style.opacity = P.st<P.maxSt ? '1' : '0.55';
  }

  var ATTACK_RANGE = 5.4;
  function updateBoss(dt){
    if(!assetsReady || B.dead) return;
    B.stateT += dt;
    var toPlayer = new THREE.Vector3().subVectors(player.position, boss.position);
    var dist = toPlayer.length();
    toPlayer.normalize();
    var ang = Math.atan2(toPlayer.x, toPlayer.z);

    if(B.state==='idle'){
      boss.rotation.y = ang;
      playAction(boss,'Idle');
      if(B.stateT>0.6){ B.state='chase'; B.stateT=0; }
    }
    else if(B.state==='chase'){
      boss.rotation.y = ang;
      playAction(boss,'Run');
      if(dist > ATTACK_RANGE*0.72){
        boss.position.addScaledVector(toPlayer, B.speed*dt);
        clampToArena(boss.position);
      }
      if(dist <= ATTACK_RANGE){ B.state='windup'; B.stateT=0; }
    }
    else if(B.state==='windup'){
      boss.rotation.y = ang;
      playAction(boss,'Idle_swordRight');
      if(B.stateT >= 0.85){ B.state='attack'; B.stateT=0; B.hitThisAttack=false;
        playAction(boss,'Run_swordAttack',{loop:THREE.LoopOnce, clamp:true, fade:0.08});
      }
    }
    else if(B.state==='attack'){
      var p2 = B.stateT/B.attackDur;
      if(p2>0.28 && p2<0.7 && !B.hitThisAttack){
        if(weaponTouches(boss, player)){ B.hitThisAttack=true; damagePlayer(24); }
      }
      if(B.stateT>=B.attackDur){ B.state='recover'; B.stateT=0; }
    }
    else if(B.state==='recover'){
      boss.rotation.y = ang;
      playAction(boss,'Idle');
      if(B.stateT>0.7){ B.state='chase'; B.stateT=0; }
    }
  }

  function updateCamera(dt){
    if(!assetsReady) return;
    var target = P.lockOn && !B.dead ? boss.position : null;
    var camYaw = yaw, camPitch = pitch;
    if(target){
      var dir = new THREE.Vector3().subVectors(player.position, target);
      camYaw = Math.atan2(dir.x, dir.z) + Math.PI*0.15;
      camPitch = Math.max(-0.5, Math.min(0.35, pitch));
    }
    var dist = 5.4, height = 2.15;
    var offset = new THREE.Vector3(
      Math.sin(camYaw)*Math.cos(camPitch),
      Math.sin(-camPitch)+0.35,
      Math.cos(camYaw)*Math.cos(camPitch)
    ).multiplyScalar(dist);
    var desired = new THREE.Vector3().copy(player.position).add(new THREE.Vector3(0,height,0)).add(offset);
    camera.position.lerp(desired, 1-Math.pow(0.001,dt));
    var lookAt = new THREE.Vector3().copy(player.position).add(new THREE.Vector3(0,1.3,0));
    if(target) lookAt.lerp(new THREE.Vector3().copy(target).add(new THREE.Vector3(0,1.7,0)), 0.42);
    camera.lookAt(lookAt);
  }

  var clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    var dt = Math.min(0.05, clock.getDelta());

    pollGamepad(dt);

    torches.forEach(function(t){
      var f = 0.85 + Math.random()*0.3;
      t.userData.light.intensity = t.userData.base*f;
      t.userData.flame.scale.setScalar(f);
    });
    var ep = embers.geometry.attributes.position;
    for(var i=0;i<EMBER_N;i++){
      var y = ep.array[i*3+1] + emberSpeed[i]*dt;
      if(y>7) y = 0;
      ep.array[i*3+1] = y;
    }
    ep.needsUpdate = true;

    if(assetsReady){
      player.userData.mixer.update(dt);
      boss.userData.mixer.update(dt);
      updatePlayer(dt);
      updateBoss(dt);
    }
    updateCamera(dt);

    composer.render();
  }
  animate();

})();
</script>
