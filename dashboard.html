<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow">
<title>集客ダッシュボード | ナマコゲームズ</title>
<style>
  :root{
    --bg:#0d1730; --panel:#131b3a; --edge:#2c3766; --ink:#eef1ff; --sub:#aab4e0;
    --gold:#e8c96a; --accent:#6ea8fe;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    padding:24px 16px 60px;
    min-height:100vh;
  }
  h1{ font-size:20px; margin:0 0 4px; }
  .sub{ color:var(--sub); font-size:13px; margin-bottom:24px; }
  .wrap{ max-width:960px; margin:0 auto; }
  .cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:28px; }
  .card{
    background:var(--panel); border:1px solid var(--edge); border-radius:10px;
    padding:16px; text-align:center;
  }
  .card .num{ font-size:28px; font-weight:700; color:var(--gold); }
  .card .label{ font-size:12px; color:var(--sub); margin-top:4px; }
  .panel{
    background:var(--panel); border:1px solid var(--edge); border-radius:10px;
    padding:20px; margin-bottom:20px;
  }
  .panel h2{ font-size:15px; margin:0 0 16px; color:var(--sub); font-weight:600; }
  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:13px; }
  .bar-row .name{ width:150px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-row .track{ flex:1; background:#0d1730; border-radius:4px; height:16px; overflow:hidden; }
  .bar-row .fill{ background:var(--accent); height:100%; border-radius:4px; }
  .bar-row .count{ width:44px; text-align:right; flex-shrink:0; color:var(--sub); }
  svg text{ fill:var(--sub); font-size:10px; font-family:'Noto Sans JP',sans-serif; }
  .empty{ color:var(--sub); font-size:13px; text-align:center; padding:20px 0; }
  .login{ max-width:320px; margin:80px auto; text-align:center; }
  .login input{
    width:100%; padding:10px; border-radius:6px; border:1px solid var(--edge);
    background:var(--panel); color:var(--ink); margin:12px 0; font-size:14px;
  }
  .login button{
    width:100%; padding:10px; border-radius:6px; border:none;
    background:var(--gold); color:#3a2f0e; font-weight:700; cursor:pointer;
  }
  .err{ color:#ff8a8a; font-size:13px; }
  .refresh{ font-size:12px; color:var(--sub); text-align:right; margin-bottom:8px; }
  a.link{ color:var(--accent); }
  .toggle{ display:inline-flex; gap:4px; background:#0d1730; border-radius:8px; padding:3px; }
  .toggle button{
    font-family:inherit; font-size:12px; padding:6px 14px; border:none; border-radius:6px;
    background:transparent; color:var(--sub); cursor:pointer;
  }
  .toggle button.active{ background:var(--accent); color:#0d1730; font-weight:700; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .panel-head h2{ margin:0; }
</style>
</head>
<body>

<div id="login" class="login">
  <h1>集客ダッシュボード</h1>
  <p class="sub">アクセストークンを入力してください</p>
  <input id="tokenInput" type="password" placeholder="トークン" />
  <button onclick="tryLogin()">表示する</button>
  <p class="err" id="loginErr"></p>
</div>

<div id="app" class="wrap" style="display:none;">
  <h1>集客ダッシュボード</h1>
  <p class="sub">ナマコゲームズ ポートフォリオのページビュー状況</p>
  <div class="refresh"><span id="updatedAt"></span> <a class="link" href="javascript:location.reload()">更新</a></div>

  <div class="cards">
    <div class="card"><div class="num" id="cardTotal">-</div><div class="label">累計ページビュー</div></div>
    <div class="card"><div class="num" id="cardToday">-</div><div class="label">今日</div></div>
    <div class="card"><div class="num" id="card7d">-</div><div class="label">直近7日</div></div>
    <div class="card"><div class="num" id="card30d">-</div><div class="label">直近30日</div></div>
  </div>

  <div class="panel">
    <h2>直近30日の推移</h2>
    <div id="trendChart"></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>ゲーム別プレイ数</h2>
      <div class="toggle" id="rankingToggle">
        <button data-mode="total" class="active">通算</button>
        <button data-mode="today">今日</button>
      </div>
    </div>
    <div id="gameRanking"></div>
  </div>

  <div class="panel">
    <h2>ページ別アクセス数(上位10・<span id="pageRankingModeLabel">通算</span>)</h2>
    <div id="pageRanking"></div>
  </div>
</div>

<script>
  var TOKEN_KEY = 'namako_dashboard_token';

  function tryLogin() {
    var t = document.getElementById('tokenInput').value.trim();
    if (!t) return;
    localStorage.setItem(TOKEN_KEY, t);
    load(t);
  }

  document.getElementById('tokenInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter') tryLogin();
  });

  function fmt(n){ return (n||0).toLocaleString('ja-JP'); }

  var GAME_NAMES = {
    '/games/origami-ace.html': 'Origami Ace',
    '/games/fruit-merge.html': 'まんまるコイン',
    '/games/water-sort.html': 'ウォーターミックス',
    '/games/korotama-run.html': 'コロタマ走',
    '/games/chain-blaster.html': 'チェインブラスター',
    '/games/armored-knight.html': 'アーマードナイト',
    '/games/reverse-break.html': 'リバースブレイク',
    '/games/park-defenders.html': 'まもれ!ぼくらの公園',
    '/games/soul-like.html': 'Ashen Vow'
  };

  function dateRangeJST(days){
    var out = [];
    var now = new Date();
    for (var i = days - 1; i >= 0; i--) {
      var d = new Date(now.getTime() - i * 86400000);
      out.push(d.toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' }));
    }
    return out;
  }

  function renderTrend(byDate){
    var days = dateRangeJST(30);
    var values = days.map(function(d){ return byDate[d] || 0; });
    var max = Math.max.apply(null, values.concat([1]));
    var w = 900, h = 160, pad = 24;
    var stepX = (w - pad*2) / (days.length - 1);
    var points = values.map(function(v, i){
      var x = pad + i * stepX;
      var y = h - pad - (v / max) * (h - pad*2);
      return x + ',' + y;
    }).join(' ');

    var el = document.getElementById('trendChart');
    if (values.every(function(v){ return v === 0; })) {
      el.innerHTML = '<div class="empty">まだデータがありません</div>';
      return;
    }
    var labelEvery = 5;
    var labels = days.map(function(d, i){
      if (i % labelEvery !== 0) return '';
      var x = pad + i * stepX;
      return '<text x="'+x+'" y="'+(h-4)+'" text-anchor="middle">'+d.slice(5)+'</text>';
    }).join('');

    el.innerHTML =
      '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:160px;" preserveAspectRatio="none">' +
      '<polyline points="'+points+'" fill="none" stroke="#6ea8fe" stroke-width="2" vector-effect="non-scaling-stroke"/>' +
      labels +
      '</svg>';
  }

  function renderBars(elId, entries, limit){
    entries = entries.slice().sort(function(a,b){ return b[1]-a[1]; });
    if (limit) entries = entries.slice(0, limit);
    var el = document.getElementById(elId);
    if (entries.length === 0) {
      el.innerHTML = '<div class="empty">まだデータがありません</div>';
      return;
    }
    var max = entries[0][1];
    el.innerHTML = entries.map(function(e){
      var pct = Math.max(4, Math.round(e[1] / max * 100));
      return '<div class="bar-row">' +
        '<div class="name" title="'+e[0]+'">'+e[0]+'</div>' +
        '<div class="track"><div class="fill" style="width:'+pct+'%"></div></div>' +
        '<div class="count">'+fmt(e[1])+'</div>' +
      '</div>';
    }).join('');
  }

  function renderRanking(byPage){
    var entries = Object.keys(byPage).map(function(k){ return [k, byPage[k]]; });
    renderBars('pageRanking', entries, 10);
  }

  function renderGameRanking(byPage){
    var entries = Object.keys(GAME_NAMES).map(function(path){
      return [GAME_NAMES[path], byPage[path] || 0];
    }).filter(function(e){ return e[1] > 0; });
    renderBars('gameRanking', entries, null);
  }

  var currentData = null;
  var rankingMode = 'total';

  function pageCountsForMode(mode){
    if (!currentData) return {};
    if (mode === 'today') {
      var today = dateRangeJST(1)[0];
      return (currentData.byDatePage && currentData.byDatePage[today]) || {};
    }
    return currentData.byPage || {};
  }

  function renderRankings(){
    var byPage = pageCountsForMode(rankingMode);
    renderGameRanking(byPage);
    renderRanking(byPage);
    document.getElementById('pageRankingModeLabel').textContent = rankingMode === 'today' ? '今日' : '通算';
  }

  document.getElementById('rankingToggle').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-mode]');
    if (!btn) return;
    rankingMode = btn.getAttribute('data-mode');
    var buttons = document.querySelectorAll('#rankingToggle button');
    for (var i = 0; i < buttons.length; i++) buttons[i].classList.remove('active');
    btn.classList.add('active');
    renderRankings();
  });

  function load(token){
    fetch('/api/stats?token=' + encodeURIComponent(token))
      .then(function(r){
        if (!r.ok) throw new Error('unauthorized');
        return r.json();
      })
      .then(function(data){
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').style.display = 'block';

        currentData = data;
        var byDate = data.byDate || {};

        document.getElementById('cardTotal').textContent = fmt(data.total);
        var days1 = dateRangeJST(1);
        var days7 = dateRangeJST(7);
        var days30 = dateRangeJST(30);
        function sum(days){ return days.reduce(function(s,d){ return s + (byDate[d]||0); }, 0); }
        document.getElementById('cardToday').textContent = fmt(sum(days1));
        document.getElementById('card7d').textContent = fmt(sum(days7));
        document.getElementById('card30d').textContent = fmt(sum(days30));

        renderTrend(byDate);
        renderRankings();

        document.getElementById('updatedAt').textContent = '取得時刻: ' + new Date().toLocaleString('ja-JP');
      })
      .catch(function(){
        localStorage.removeItem(TOKEN_KEY);
        document.getElementById('login').style.display = 'block';
        document.getElementById('app').style.display = 'none';
        document.getElementById('loginErr').textContent = 'トークンが正しくないか、取得に失敗しました';
      });
  }

  (function init(){
    var saved = localStorage.getItem(TOKEN_KEY);
    if (saved) load(saved);
  })();
</script>

</body>
</html>
