<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ナマコゲームズ</title>
<meta name="description" content="ナマコゲームズ — 個人開発のブラウザゲーム集。パズル・シューティングなど無料で今すぐ遊べます。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ナマコゲームズ">
<meta property="og:title" content="ナマコゲームズ">
<meta property="og:description" content="個人開発のブラウザゲーム集。パズル・シューティングなど無料で今すぐ遊べます。">
<meta property="og:image" content="https://games-portfolio-red.vercel.app/assets/og-image.png">
<meta property="og:url" content="https://games-portfolio-red.vercel.app/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@Namako_papasu">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<script data-goatcounter="https://namakofactory.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
  :root{
    --navy:#0d1730; --navy-2:#16204a; --panel:#131b3aee; --panel-edge:#3a4a8a;
    --gold:#e8c96a; --gold-dark:#8a6f2e; --ink:#eef1ff; --sub:#aab4e0; --red:#ff5b6a;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    height:100vh; overflow:hidden;
    background:#05070f;
    font-family:'Noto Sans JP',sans-serif;
    color:var(--ink);
  }
  .pixel{ font-family:'Press Start 2P',monospace; }

  .scene{
    position:relative; width:100%; height:100vh;
    display:flex; flex-direction:column;
    overflow:hidden;
  }

  /* ---- background town scene ---- */
  .bg{
    position:absolute; inset:0; overflow:hidden; z-index:0;
    background-image:url('assets/town-bg.jpg');
    background-size:cover; background-position:center bottom;
  }

  /* ---- ornate frame ---- */
  .frame{
    position:relative; flex:1; min-height:0; margin:10px; border:6px solid var(--navy-2); outline:3px solid var(--gold);
    outline-offset:-11px; box-shadow:inset 0 0 0 3px #050a1c;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:10px 4% 6px; gap:14px; z-index:1;
  }
  .corner{ position:absolute; width:14px; height:14px; background:var(--gold); }
  .corner.tl{ top:-8px; left:-8px; } .corner.tr{ top:-8px; right:-8px; }
  .corner.bl{ bottom:-8px; left:-8px; } .corner.br{ bottom:-8px; right:-8px; }

  .mascots{ display:flex; align-items:flex-end; justify-content:center; gap:2%; width:100%; margin-top:-32px; }
  .slime{ width:11%; min-width:52px; filter:drop-shadow(0 6px 6px rgba(0,0,0,0.4)); animation:bob 2.4s ease-in-out infinite; }
  .slime.right{ transform:scaleX(-1); animation-delay:-1.2s; }
  @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }
  .slime.right{ animation-name:bobR; }
  @keyframes bobR{ 0%,100%{ transform:scaleX(-1) translateY(0);} 50%{ transform:scaleX(-1) translateY(-6px);} }

  .banner{
    position:relative; flex:1; max-width:900px; text-align:center;
    display:flex; align-items:center; justify-content:center;
    padding:0 12px;
  }
  .banner-logo{ width:100%; max-width:700px; height:auto; display:block; filter:drop-shadow(0 4px 10px rgba(0,0,0,0.45)); }

  .windows{ display:flex; flex-wrap:wrap; align-items:stretch; gap:16px; width:100%; max-width:900px; justify-content:center; margin-top:4px; }
  .window{
    background:var(--panel); border:3px solid var(--panel-edge); box-shadow:inset 0 0 0 2px #05070f;
    min-width:270px; padding:0 0 14px;
  }
  .window.works{ flex:1 1 520px; }
  .window.contact{ flex:1 1 280px; display:flex; flex-direction:column; }
  .titlebar{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:linear-gradient(180deg,#2c3d78,#1a2450); padding:10px 14px;
    font-size:clamp(13px,2vw,19px); color:var(--red); border-bottom:3px solid var(--panel-edge);
  }
  .titlebar .jp{ color:var(--ink); font-family:'Noto Sans JP',sans-serif; font-size:15px; margin-left:6px; }
  .titlebar .close{ color:var(--sub); font-size:16px; }

  .tiles{ display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:8px; }
  .tile{
    display:flex; flex-direction:column; align-items:center; gap:4px; text-decoration:none;
    background:#0e1530; border:2px solid var(--panel-edge); padding:7px 8px; color:var(--ink);
    transition:transform 0.15s, border-color 0.15s, background 0.15s;
  }
  .tile:hover{ transform:translateY(-3px); border-color:var(--gold); background:#182050; }
  .tile .icon{ font-size:28px; }
  .tile .label{ font-size:13px; letter-spacing:0.03em; text-align:center; }
  .tile.disabled{ opacity:0.45; cursor:default; }
  .tile.disabled:hover{ transform:none; border-color:var(--panel-edge); background:#0e1530; }

  .contact-body{ flex:1; display:flex; flex-direction:column; justify-content:center; padding:8px 12px 2px; text-align:center; }
  .contact-body .social{
    display:inline-flex; flex-direction:column; align-items:center; gap:4px; text-decoration:none; color:var(--ink);
  }
  .contact-body .social .icon{
    width:36px; height:36px; border-radius:10px; background:#fff; color:#000; display:flex;
    align-items:center; justify-content:center; font-size:20px; font-weight:800;
    box-shadow:0 3px 0 var(--panel-edge);
  }
  .contact-body .social:hover .icon{ transform:translateY(-2px); box-shadow:0 5px 0 var(--gold); }
  .contact-body .social span:last-child{ font-size:13px; }
  .contact-body .handle{ margin-top:6px; font-size:12px; color:var(--sub); }
  .contact-body .msg{
    display:block; margin:14px auto 0; width:fit-content; background:var(--gold); color:#3a2e10;
    border:none; padding:8px 20px; font-size:12px; font-weight:700; text-decoration:none;
  }

  .dialog{
    width:100%; max-width:560px; background:#0e1530; border:3px solid var(--panel-edge);
    box-shadow:inset 0 0 0 2px #05070f; padding:11px 16px 8px; font-size:clamp(10px,1.6vw,13px);
    color:var(--ink); text-align:left; margin-top:34px;
  }
  .dialog .lead{ color:var(--sub); }
  .dialog .target{ color:var(--gold); }

  .copyright{ font-size:13px; color:var(--sub); letter-spacing:0.08em; opacity:0.9; text-shadow:0 1px 3px #000, 0 0 6px rgba(0,0,0,0.8); }

  .statusbar{
    position:relative; z-index:2; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; gap:4%; flex-wrap:wrap;
    background:var(--navy-2); border-top:3px solid var(--gold); padding:10px 12px;
    font-size:clamp(9px,1.4vw,12px); color:var(--ink);
  }
  .statusbar .walk{ color:var(--gold); }

  footer{ text-align:center; margin-top:14px; color:#5a6690; font-size:11px; }

  /* On narrow screens the full-bleed no-scroll layout can't fit everything
     at once, so fall back to a normal scrolling page instead of clipping. */
  @media (max-width:640px){
    body{ height:auto; min-height:100vh; overflow-y:auto; overflow-x:hidden; }
    .scene{ height:auto; min-height:100vh; }
    .frame{ flex:none; }
    .banner{ font-size:20px; padding:14px 10px; }
    .slime{ min-width:34px; }
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="bg"></div>

    <div class="frame">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>

      <div class="mascots">
        <svg class="slime" viewBox="0 0 40 32" shape-rendering="crispEdges">
          <rect x="10" y="4" width="20" height="4" fill="#9b6fd6"/>
          <rect x="6" y="8" width="28" height="8" fill="#9b6fd6"/>
          <rect x="4" y="16" width="32" height="10" fill="#a97bde"/>
          <rect x="6" y="26" width="28" height="4" fill="#7d54b8"/>
          <rect x="12" y="16" width="4" height="4" fill="#231636"/>
          <rect x="24" y="16" width="4" height="4" fill="#231636"/>
          <rect x="10" y="10" width="6" height="4" fill="#c9a6f0"/>
        </svg>
        <div class="banner"><img class="banner-logo" src="assets/logo2.png" alt="ナマコゲームズ"></div>
        <svg class="slime right" viewBox="0 0 40 32" shape-rendering="crispEdges">
          <rect x="10" y="4" width="20" height="4" fill="#9b6fd6"/>
          <rect x="6" y="8" width="28" height="8" fill="#9b6fd6"/>
          <rect x="4" y="16" width="32" height="10" fill="#a97bde"/>
          <rect x="6" y="26" width="28" height="4" fill="#7d54b8"/>
          <rect x="12" y="16" width="4" height="4" fill="#231636"/>
          <rect x="24" y="16" width="4" height="4" fill="#231636"/>
          <rect x="10" y="10" width="6" height="4" fill="#c9a6f0"/>
        </svg>
      </div>

      <div class="windows">
        <div class="window works" id="worksWindow" onmouseenter="setDialog('WORKS')">
          <div class="titlebar"><span class="pixel">WORKS</span><span class="jp">作品</span><span class="close">×</span></div>
          <div class="tiles">
            <div class="tile disabled">
              <span class="icon">⚔️</span><span class="label">アクションゲーム<br>(近日公開)</span>
            </div>
            <a class="tile" href="games/fruit-merge.html">
              <span class="icon">🧩</span><span class="label">パズルゲーム</span>
            </a>
            <a class="tile" href="games/origami-ace.html">
              <span class="icon">🚀</span><span class="label">シューティング</span>
            </a>
            <div class="tile disabled">
              <span class="icon">❓</span><span class="label">その他<br>(近日公開)</span>
            </div>
          </div>
        </div>

        <div class="window contact" id="contactWindow" onmouseenter="setDialog('CONTACT')">
          <div class="titlebar"><span class="pixel">CONTACT</span><span class="jp">お問い合わせ</span><span class="close">×</span></div>
          <div class="contact-body">
            <a class="social" href="https://x.com/Namako_papasu" target="_blank" rel="noopener">
              <span class="icon">𝕏</span>
              <span>X (Twitter)</span>
            </a>
            <div class="handle">@Namako_papasu</div>
          </div>
        </div>
      </div>

      <div class="dialog pixel">
        <span class="lead">SELECT AN OPTION</span><br>
        ▶ <span class="target" id="dialogTarget">WORKS</span>
      </div>
      <div class="copyright pixel">© 2026 NAMAKOFACTORY</div>
    </div>

    <div class="statusbar pixel">
      <span>HP: 100/100</span><span>MP: 50/50</span><span>GOLD: 9999</span><span class="walk">WALK</span>
    </div>
  </div>

  <script>
    function setDialog(name){ document.getElementById('dialogTarget').textContent = name; }
  </script>
</body>
</html>
