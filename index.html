<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ゲームコレクション</title>
<style>
  :root{
    --bg-0:#0b0d17;
    --bg-1:#12152580;
    --card:#151829;
    --card-border:#262b47;
    --text-0:#f2f3fb;
    --text-1:#a6abc8;
    --accent-1:#7c6cff;
    --accent-2:#ff6cab;
    --accent-3:#4fd1c5;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, #241f47 0%, transparent 45%),
      radial-gradient(circle at 85% 0%, #3a1f42 0%, transparent 40%),
      var(--bg-0);
    color:var(--text-0);
    font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif;
  }
  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:64px 24px 96px;
  }
  header{
    text-align:center;
    margin-bottom:56px;
  }
  .eyebrow{
    display:inline-block;
    font-size:12px;
    letter-spacing:0.2em;
    color:var(--accent-3);
    background:rgba(79,209,197,0.1);
    border:1px solid rgba(79,209,197,0.3);
    padding:4px 14px;
    border-radius:999px;
    margin-bottom:18px;
  }
  h1{
    font-size:clamp(28px, 5vw, 42px);
    margin:0 0 12px;
    background:linear-gradient(90deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-weight:800;
  }
  header p{
    color:var(--text-1);
    font-size:15px;
    margin:0;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
    gap:24px;
  }
  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:20px;
    overflow:hidden;
    text-decoration:none;
    color:inherit;
    display:flex;
    flex-direction:column;
    transition:transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .card:hover{
    transform:translateY(-6px);
    border-color:var(--accent-1);
    box-shadow:0 20px 40px -20px rgba(124,108,255,0.5);
  }
  .thumb{
    height:160px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:56px;
  }
  .thumb.origami{ background:linear-gradient(135deg,#1b2a4a,#2b3f73); }
  .thumb.park{ background:linear-gradient(135deg,#1c3a2e,#2f6b4a); }
  .card-body{
    padding:20px 22px 24px;
    display:flex;
    flex-direction:column;
    gap:10px;
    flex:1;
  }
  .genre{
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--accent-3);
    font-weight:600;
  }
  .card h2{
    margin:0;
    font-size:20px;
  }
  .card p{
    margin:0;
    color:var(--text-1);
    font-size:13.5px;
    line-height:1.7;
    flex:1;
  }
  .play{
    margin-top:8px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    font-weight:700;
    color:#0b0d17;
    background:linear-gradient(90deg, var(--accent-1), var(--accent-2));
    padding:9px 16px;
    border-radius:999px;
    width:fit-content;
  }
  footer{
    text-align:center;
    margin-top:64px;
    color:var(--text-1);
    font-size:12px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="eyebrow">FREE WEB GAMES</span>
      <h1>ゲームコレクション</h1>
      <p>ブラウザですぐ遊べる自作ゲーム集です。インストール不要、無料でお楽しみいただけます。</p>
    </header>

    <div class="grid">
      <a class="card" href="games/origami-ace.html">
        <div class="thumb origami">✈️</div>
        <div class="card-body">
          <span class="genre">折り紙スカイシューター</span>
          <h2>Origami Ace</h2>
          <p>紙飛行機を操って空を駆け抜けるシューティングゲーム。スワイプ操作でスコアを狙おう。</p>
          <span class="play">▶ 今すぐ遊ぶ</span>
        </div>
      </a>

      <a class="card" href="games/park-defenders.html">
        <div class="thumb park">🌳</div>
        <div class="card-body">
          <span class="genre">タワーディフェンス・ストーリー</span>
          <h2>まもれ!ぼくらの公園</h2>
          <p>取り壊し危機の公園を、手作りの防衛策で守り抜け。3D盤面をドラッグ&ズームしながら8日間の攻防を戦うタワーディフェンス。</p>
          <span class="play">▶ 今すぐ遊ぶ</span>
        </div>
      </a>
    </div>

    <footer>© 2026 Game Collection</footer>
  </div>
</body>
</html>
